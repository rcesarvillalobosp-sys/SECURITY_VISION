repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: import-linter
        name: import-linter (reglas de arquitectura)
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        types: [python]
      - id: no-env-file
        name: no versionar .env
        entry: .env files must not be committed
        language: fail
        files: (^|/)\.env$
