[project]
name = "security-vision"
version = "0.1.0"
description = "Plataforma modular de videovigilancia y análisis de seguridad (EPP) mediante IA"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Herramientas de datos/ML: no forman parte del runtime del producto.
ml = [
    "numpy>=2.0",
    "pillow>=11.0",
    "httpx>=0.27",
]

[project.scripts]
svds = "security_vision_ml.datasets.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/security_vision", "src/security_vision_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.importlinter]
root_packages = ["security_vision", "security_vision_ml"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "El producto no depende de las herramientas de ML"
type = "forbidden"
source_modules = ["security_vision"]
forbidden_modules = ["security_vision_ml"]

[[tool.importlinter.contracts]]
name = "El dominio no depende de librerías de terceros pesadas"
type = "forbidden"
source_modules = ["security_vision.core"]
forbidden_modules = ["numpy", "PIL", "httpx", "cv2", "onnxruntime"]
