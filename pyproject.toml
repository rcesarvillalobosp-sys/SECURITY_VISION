[project]
name = "security-vision"
version = "0.1.0"
description = "Plataforma modular de videovigilancia y análisis de seguridad (EPP) mediante IA"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "websockets>=13",  # transporte WebSocket de uvicorn (sin él, el WS en vivo se rechaza)
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "cryptography>=44",
    "prometheus-client>=0.21",
    "python-multipart>=0.0.18",
    "numpy>=2.0",
    "av>=14",
    "pillow>=13.0.0",
    "psutil>=7.2.2",
]

[project.optional-dependencies]
# Herramientas de datos/ML: no forman parte del runtime del producto.
ml = [
    "numpy>=2.0",
    "pillow>=11.0",
    "httpx>=0.27",
]
# Motores de inferencia (runtime del worker). onnxruntime-gpu incluye también el proveedor CPU.
inference = [
    "onnxruntime-gpu[cuda,cudnn]>=1.22",
    "openvino>=2025.2",
]
# Exportación y entrenamiento (fuera del runtime del producto).
train = [
    "torch>=2.7",
    "torchvision>=0.22",
    "transformers>=4.53",
    "onnx>=1.18",
    "onnxscript>=0.3",
    "accelerate>=1.8",
    "safetensors>=0.5",
    "scipy>=1.14",
]

[project.scripts]
svds = "security_vision_ml.datasets.cli:main"
svctl = "security_vision_api.cli:main"
sv-worker = "security_vision_worker.main:main"

[project.entry-points."security_vision.video_sources"]
# Proveedores incluidos; plugins de terceros se declaran igual en su propio paquete.
pyav = "security_vision.plugins.video_sources.pyav_source:PyAVVideoSource"
testpattern = "security_vision.plugins.video_sources.test_pattern:TestPatternSource"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/security_vision", "src/security_vision_ml", "apps/api/security_vision_api", "apps/processing-worker/security_vision_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/security_vision/infrastructure/database/migrations/versions/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["security_vision", "security_vision_ml", "security_vision_api"]

[tool.importlinter]
root_packages = ["security_vision", "security_vision_ml", "security_vision_api", "security_vision_worker"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "El producto no depende de las herramientas de ML"
type = "forbidden"
source_modules = ["security_vision"]
forbidden_modules = ["security_vision_ml"]

[[tool.importlinter.contracts]]
name = "El producto no depende de la capa de composición (apps)"
type = "forbidden"
source_modules = ["security_vision"]
forbidden_modules = ["security_vision_api", "security_vision_worker"]

[[tool.importlinter.contracts]]
name = "Capas: modules -> core; infrastructure -> core; core no depende de nadie"
type = "layers"
layers = [
    "security_vision.modules | security_vision.infrastructure | security_vision.plugins",
    "security_vision.core",
]

[[tool.importlinter.contracts]]
name = "El núcleo no depende de frameworks ni de tecnologías concretas"
type = "forbidden"
source_modules = ["security_vision.core"]
forbidden_modules = ["fastapi", "sqlalchemy", "asyncpg", "PIL", "httpx", "cv2", "onnxruntime", "jwt", "argon2"]

[[tool.importlinter.contracts]]
name = "El dominio es Python puro (sin numpy)"
type = "forbidden"
source_modules = ["security_vision.core.domain", "security_vision.core.events"]
forbidden_modules = ["numpy"]

[[tool.importlinter.contracts]]
name = "Los módulos de negocio no dependen de plugins concretos"
type = "forbidden"
source_modules = ["security_vision.modules"]
forbidden_modules = ["security_vision.plugins"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
