name: ci
on: [push, pull_request]
permissions: {contents: read}
jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6-alpine
        env: {POSTGRES_USER: security_vision, POSTGRES_PASSWORD: ci-only-password, POSTGRES_DB: security_vision_test}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U security_vision" --health-interval 5s --health-retries 10
    env:
      SV_TEST_DATABASE_URL: postgresql+asyncpg://security_vision:ci-only-password@localhost:5432/security_vision_test
      SV_DATABASE_URL: postgresql+asyncpg://security_vision:ci-only-password@localhost:5432/security_vision_test
      SV_JWT_SECRET: ci-only-jwt-secret-not-for-production-000000
      SV_SECRETS_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12 --extra ml --frozen
      - run: uv run alembic upgrade head
      - run: uv run python scripts/check.py
