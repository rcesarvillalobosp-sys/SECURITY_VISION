# Configuración mínima de MediaMTX (se completa en la Fase 2: rutas por cámara, proxy RTSP).
# Solo usuarios autenticados pueden publicar; la lectura se restringe a la red local del compose.
logLevel: info
api: no
rtsp: yes
rtspAddress: :8554
webrtc: yes
webrtcAddress: :8889
hls: no
rtmp: no
srt: no
authMethod: internal
authInternalUsers:
  - user: any
    pass:
    ips: ["127.0.0.1", "::1", "172.16.0.0/12"]
    permissions:
      - action: read
  # El usuario de publicación (worker) se añadirá en la Fase 2 con credenciales del .env.
paths:
  all_others:
