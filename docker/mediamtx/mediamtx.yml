# Para Docker, generar la configuración real (con credenciales) a partir de la misma plantilla
# que en desarrollo:  uv run python -c "import sys; sys.path.insert(0,'scripts'); ..."
# Ver scripts/dev_mediamtx.py (render_config). Este archivo es un marcador seguro por defecto:
# sin API, sin publicación y lectura solo desde la red del compose.
logLevel: info
api: no
rtsp: yes
webrtc: yes
hls: no
rtmp: no
srt: no
authMethod: internal
authInternalUsers:
  - user: any
    pass:
    ips: ["127.0.0.1", "::1", "172.16.0.0/12"]
    permissions:
      - action: read
paths:
  all_others:
